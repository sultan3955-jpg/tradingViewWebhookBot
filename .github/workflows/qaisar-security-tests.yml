name: Qaisar security tests
on:
  push:
    branches: ["security/qaisar-webhook-hardening"]
  pull_request:
    paths:
      - 'main.py'
      - 'qaisar_security.py'
      - 'apply_qaisar_security.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/qaisar-security-tests.yml'
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q main.py qaisar_security.py apply_qaisar_security.py
      - name: Run security tests
        run: python -m pytest tests -q
