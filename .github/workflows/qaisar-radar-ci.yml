name: Qaisar US Radar CI

on:
  push:
    branches:
      - feature/qaisar-us-radar-v1
  pull_request:
    paths:
      - "qaisar_radar/**"
      - ".github/workflows/qaisar-radar-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r qaisar_radar/requirements.txt
      - name: Compile Python
        run: python -m compileall -q qaisar_radar
      - name: Run radar tests
        run: python -m pytest -q qaisar_radar/tests
