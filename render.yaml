services:
  - type: web
    name: tradingview-webhook-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: export PYTHONPATH="$PWD"; cd /var/data && exec uvicorn main:app --host 0.0.0.0 --port "$PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
    disk:
      name: signals-data
      mountPath: /var/data
      sizeGB: 1
